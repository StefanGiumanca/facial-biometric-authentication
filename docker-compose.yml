services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: visionauth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d visionauth"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/visionauth
      ADMIN_KEY: dev-admin-key
      OCR_USE_GPU: "0"
      MPLCONFIGDIR: /tmp/matplotlib
      XDG_CACHE_HOME: /tmp/.cache
      MEDIAPIPE_DISABLE_GPU: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy

  web-admin:
    build:
      context: .
      dockerfile: web-admin/Dockerfile
    environment:
      VITE_CONNECTION_MODE: wifi
      VITE_WIFI_API_BASE_URL: http://${HOST_IP:-127.0.0.1}:8000
      VITE_NGROK_API_BASE_URL: ${NGROK_API_BASE_URL:-https://reward-botanist-tag.ngrok-free.dev}
    ports:
      - "5173:5173"
    volumes:
      - ./web-admin:/app
      - web_admin_node_modules:/app/node_modules
    depends_on:
      - backend

  mobile:
    build:
      context: .
      dockerfile: visionauth-mobile/Dockerfile
    environment:
      EXPO_NO_TELEMETRY: "1"
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_IP:-127.0.0.1}
      EXPO_PUBLIC_CONNECTION_MODE: wifi
      EXPO_PUBLIC_WIFI_API_BASE_URL: http://${HOST_IP:-127.0.0.1}:8000
      EXPO_PUBLIC_WIFI_WEB_ADMIN_URL: http://${HOST_IP:-127.0.0.1}:5173
      EXPO_PUBLIC_NGROK_API_BASE_URL: ${NGROK_API_BASE_URL:-https://reward-botanist-tag.ngrok-free.dev}
      EXPO_PUBLIC_NGROK_WEB_ADMIN_URL: http://${HOST_IP:-127.0.0.1}:5173
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - ./visionauth-mobile:/app
      - mobile_node_modules:/app/node_modules
    depends_on:
      - backend
      - web-admin
    stdin_open: true
    tty: true
    command: sh -c "npm run start -- --clear --${EXPO_MODE:-lan}"

volumes:
  postgres_data:
  web_admin_node_modules:
  mobile_node_modules:
