services:
  - type: web
    name: visionauth-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: .
    envVars:
      - key: PORT
        value: 8000
      - key: ADMIN_KEY
        value: dev-admin-key
      - key: OCR_USE_GPU
        value: 0
      - key: MEDIAPIPE_DISABLE_GPU
        value: 1
      - key: LIVENESS_USE_MEDIAPIPE_GPU
        value: 0
      - key: DATABASE_URL
        fromDatabase:
          name: visionauth-postgres
          property: connectionString

databases:
  - name: visionauth-postgres
    plan: free
    databaseName: visionauth
